server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React SPA: serve static files with fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to the Node API container
    location /api/ {
        proxy_pass http://node:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;

        # Critical for the download test: streaming without buffering
        # allows the frontend to measure live speed in real time.
        proxy_buffering off;
        proxy_request_buffering off;

        proxy_read_timeout  90s;
        proxy_send_timeout  90s;
    }

    # Allow large uploads for the speed test (12 MB parallel chunks)
    client_max_body_size 20m;
}